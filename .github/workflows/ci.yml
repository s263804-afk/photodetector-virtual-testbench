name: C, NET10 and actual ARM simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-simulation:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'
      - name: Install hash-pinned user-level tools and locked dependencies
        run: ./scripts/setup.ps1
      - name: C tests, ARM build, NET tests, real Renode scenarios
        run: ./scripts/verify.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-and-scenarios
          path: |
            reports/evidence/
            reports/example/
